# =============================================================================
# HIMALAYAN DISPATCH — PRODUCTION NGINX REVERSE PROXY + LET'S ENCRYPT TLS VHOST
# Target path on VPS: /etc/nginx/sites-available/dispatch.kashmir-ecowatch.com
# Symlink on VPS:     /etc/nginx/sites-enabled/dispatch.kashmir-ecowatch.com
#
# Architecture:
#   One VPS (74.208.248.57) · Two Distinct Public Websites · One Integrated Backend
#   - Main KEW Domain (`kashmir-ecowatch.com`) remains in its existing Nginx file, untouched.
#   - `dispatch.kashmir-ecowatch.com` terminates TLS 1.2/1.3 with its own Let's Encrypt
#     certificate (preventing fallback to `api.primelogicsol.com` on port 443) and
#     forwards `Host: dispatch.kashmir-ecowatch.com` to `{{KEW_UPSTREAM_URL}}`
#     (dynamically matched to KEW's live Next.js upstream port by `02-activate-subdomain-ssl.sh`).
# =============================================================================

# 1. HTTP (Port 80) -> Permanent 308 HTTPS Redirect + ACME Renewal Webroot
server {
    listen 80;
    listen [::]:80;
    server_name dispatch.kashmir-ecowatch.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 308 https://dispatch.kashmir-ecowatch.com$request_uri;
    }
}

# 2. Primary Production HTTPS Vhost — https://dispatch.kashmir-ecowatch.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dispatch.kashmir-ecowatch.com;

    # Dedicated Let's Encrypt Certificate for dispatch.kashmir-ecowatch.com
    ssl_certificate     /etc/letsencrypt/live/dispatch.kashmir-ecowatch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dispatch.kashmir-ecowatch.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Hardened Editorial Security Headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow contributor credential PDFs & documentary plate uploads
    client_max_body_size 25M;

    # Dedicated access & error logs for Himalayan Dispatch
    access_log /var/log/nginx/dispatch.kashmir-ecowatch.access.log;
    error_log  /var/log/nginx/dispatch.kashmir-ecowatch.error.log warn;

    # ACME renewal pass-through over HTTPS if needed
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    # Proxy to Shared KEW + Himalayan Dispatch Next.js 16 Application
    location / {
        proxy_pass {{KEW_UPSTREAM_URL}};
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
