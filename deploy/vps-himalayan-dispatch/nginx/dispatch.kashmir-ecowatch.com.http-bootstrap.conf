# =============================================================================
# HIMALAYAN DISPATCH — PHASE 1 NGINX HTTP BOOTSTRAP VHOST
# Target path on VPS: /etc/nginx/sites-available/dispatch.kashmir-ecowatch.com
# Symlink on VPS:     /etc/nginx/sites-enabled/dispatch.kashmir-ecowatch.com
#
# Note: `{{KEW_UPSTREAM_URL}}` is populated automatically by `02-activate-subdomain-ssl.sh`
# from the live `kashmir-ecowatch.com` Nginx configuration (never assumed to be 3002).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dispatch.kashmir-ecowatch.com;

    # ACME HTTP-01 Challenge Webroot for Let's Encrypt Certbot
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass {{KEW_UPSTREAM_URL}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
